<VirtualHost *:8080>
    ServerName motor-test.local
    DocumentRoot /var/www/html
    Alias /_health /var/www/html/_health.php
    TraceEnable Off
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.php
        AuthType Basic
        AuthName "WAP-MOTOR test"
        AuthUserFile /run/motor.htpasswd
        Require valid-user
        <Files "_health.php">
            Require all granted
        </Files>
        <FilesMatch "(^\.|\.(dat|prof|priv|sfx|ini|log|bak)$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <LocationMatch "^/(local|includes)(/|$)">
        Require all denied
    </LocationMatch>
    AddDefaultCharset UTF-8
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Header always set Referrer-Policy "same-origin"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
